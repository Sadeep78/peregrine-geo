name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'protocol/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'protocol/**'
      - '.github/workflows/backend.yml'

jobs:
  verify:
    name: Verify Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: extractions/setup-just@v2

      - name: Verify Backend
        run: just verify-backend
